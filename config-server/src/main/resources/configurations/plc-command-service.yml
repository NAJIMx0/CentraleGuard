server:
  port: 8998

eureka:
  instance:
    hostname: plc-command-service
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

