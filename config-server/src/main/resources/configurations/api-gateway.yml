server:
  port: 8997

eureka:
  instance:
    hostname: api-gateway
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka

spring:
  config:
    import: optional:http://config-server:8888
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: telemetry-service
              uri: http://telemetry-service:8999
              predicates:
                - Path=/api/sensors/telemetry

#            - id: plc-command-service
#              uri: http://plc-command-service:8998
#              predicates:
#                - Path=/api/plc/command