_format_version: "3.0"
services:
  - name: telemetry-service
    url: http://telemetry-service:8999
    routes:
      - name: telemetry-route
        paths: ["/api/sensors/telemetry"]
        strip_path: false
  - name: plc-command-service
    url: http://plc-command-service:8998
    routes:
      - name: plc-route
        paths: ["/api/plc/command"]
        strip_path: false
        methods: ["POST"]